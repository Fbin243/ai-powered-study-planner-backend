name: Deploy Go app to EC2

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Create .env file
        run: |
          cat <<EOF > .env
          PORT=${{secrets.PORT}}
          DB_HOST=${{secrets.DB_HOST}}
          DB_USERNAME=${{secrets.DB_USERNAME}}
          DB_PASSWORD=${{secrets.DB_PASSWORD}}
          DB_DATABASE=${{secrets.DB_DATABASE}}
          FIREBASE_ADMIN=${{secrets.FIREBASE_ADMIN}}
          FIREBASE_WEB_API_KEY=${{secrets.FIREBASE_WEB_API_KEY}}
          EOF
      - name: Set up Firebase Admin JSON
        run: |     
          cat <<EOF | base64 --decode > firebase-admin.json
          ${{ secrets.FIREBASE_ADMIN_JSON }}
          EOF
      - name: Login to docker hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - name: Build docker image
        run: docker build -t fbin243/awp .
      - name: Push docker image
        run: docker push fbin243/awp:latest
  deploy:
    needs: build
    runs-on: self-hosted
    steps:
      - name: Pull docker image
        run: docker pull fbin243/awp:latest
      - name: Stop the running container
        run: docker stop awp-container
      - name: Prune docker system
        run: docker system prune -a -f
      - name: Run docker container
        run: docker run -d -p 8080:8080 --name awp-container fbin243/awp:latest
